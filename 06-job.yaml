apiVersion: batch/v1
kind: Job
metadata:
  name: ahnaf-tripplanner-job
  namespace: travel-dev
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ahnaf-tripplanner-job
        environment: development
    spec:
      restartPolicy: Never
      containers:
        - name: cleanup
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[JOB] tripplanner DB cleanup started at $(date)"
              echo "Removing expired booking sessions..."; sleep 5
              echo "Purging stale itinerary drafts..."; sleep 5
              echo "[JOB] Cleanup completed successfully at $(date)"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
