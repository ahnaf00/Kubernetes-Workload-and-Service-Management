apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ahnaf-tripplanner-daemonset
  namespace: travel-dev
  labels:
    app: tripplanner-logs
    environment: development
spec:
  selector:
    matchLabels:
      app: tripplanner-logs
  template:
    metadata:
      labels:
        app: tripplanner-logs
        environment: development
    spec:
      containers:
        - name: log-collector
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - 'while true; do echo "[HEARTBEAT] $(date) node=${NODE_NAME} pod=$(hostname)"; sleep 60; done'
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
