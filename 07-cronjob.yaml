apiVersion: batch/v1
kind: CronJob
metadata:
  name: ahnaf-tripplanner-cronjob
  namespace: travel-dev
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: tripplanner-maintenance
        spec:
          restartPolicy: Never
          containers:
            - name: maintenance
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "[CRON] Maintenance run at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "VACUUM / ANALYZE simulated on tripplanner DB"; sleep 3
                  echo "[CRON] Maintenance finished"
