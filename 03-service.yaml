apiVersion: v1
kind: Service
metadata:
  name: ahnaf-tripplanner-service
  namespace: travel-dev
  labels:
    app: tripplanner
    environment: development
spec:
  type: NodePort
  selector:
    app: tripplanner
  ports:
    - port: 80
      targetPort: 8017
      nodePort: 30097
---
apiVersion: v1
kind: Service
metadata:
  name: ahnaf-tripplanner-db-service
  namespace: travel-dev
  labels:
    app: tripplanner-db
spec:
  clusterIP: None
  selector:
    app: tripplanner-db
  ports:
    - port: 5432
      name: postgres
